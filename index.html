  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #fff5f5;
      --text-primary: #3a2a2a;
      --text-secondary: #5d4545;
      --accent-pink: #ffb3db;
      --accent-gold: #f7df92;
      --accent-dark: #5d4545;
      --card-bg: #ffffff;
      --border-color: #ffb3db;
      --shadow-sm: 0 4px 20px rgba(93,69,69,0.08);
      --shadow-md: 0 8px 30px rgba(93,69,69,0.12);
      --shadow-lg: 0 20px 40px rgba(93,69,69,0.15);
      --transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    body.dark {
      --bg-primary: #1a1a2e;
      --bg-secondary: #16213e;
      --text-primary: #e0e0e0;
      --text-secondary: #ffb3db;
      --card-bg: #0f0f23;
      --border-color: #ffb3db44;
      --shadow-sm: 0 4px 20px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 30px rgba(0,0,0,0.4);
      --shadow-lg: 0 20px 40px rgba(0,0,0,0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Tajawal', 'Inter', sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
      line-height: 1.5;
      transition: var(--transition);
    }

    /* Scroll to top button */
    .scroll-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: var(--accent-dark);
      color: var(--accent-gold);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
      z-index: 99;
      font-size: 1.3rem;
      box-shadow: var(--shadow-md);
    }
    .scroll-top.show {
      opacity: 1;
      visibility: visible;
    }
    .scroll-top:hover {
      background: var(--accent-pink);
      color: var(--accent-dark);
      transform: translateY(-5px) scale(1.05);
    }

    /* Language & Dark Mode Toggles */
    .header-tools {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .toggle-btn {
      background: var(--accent-gold);
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
      font-family: inherit;
    }
    .toggle-btn:hover {
      transform: scale(1.03);
      background: var(--accent-pink);
    }

    /* Header */
    .header {
      background: rgba(var(--bg-primary-rgb, 255,255,255), 0.96);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 2px solid var(--border-color);
      padding: 15px 0;
    }
    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }
    .logo h1 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-dark), var(--accent-pink), var(--accent-gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .cart-icon {
      position: relative;
      background: var(--accent-gold);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }
    .cart-icon:hover { transform: scale(1.05); background: var(--accent-pink); }
    .cart-count {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--accent-dark);
      color: var(--accent-gold);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Hero */
    .hero {
      background: linear-gradient(120deg, var(--accent-pink)22, var(--accent-gold)22);
      margin: 30px 0 50px;
      border-radius: 48px;
      padding: 60px 40px;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }
    .hero h2 { font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, var(--accent-dark), var(--accent-pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    
    /* Products Grid */
    .container { max-width: 1400px; margin: 0 auto; padding: 0 32px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 32px; margin: 40px 0; }
    .product-card {
      background: var(--card-bg);
      border-radius: 32px;
      transition: var(--transition);
      border: 1px solid var(--border-color);
      overflow: hidden;
      cursor: pointer;
      position: relative;
    }
    .product-card:hover { transform: translateY(-10px) scale(1.02); box-shadow: var(--shadow-lg); border-color: var(--accent-gold); }
    .badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--accent-dark);
      color: var(--accent-gold);
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 800;
      z-index: 2;
    }
    .product-img { padding: 30px; text-align: center; }
    .product-img svg { width: 120px; height: 120px; filter: drop-shadow(0 8px 12px rgba(93,69,69,0.2)); transition: 0.3s; }
    .product-card:hover .product-img svg { transform: scale(1.05); }
    .product-title { font-size: 1.4rem; font-weight: 800; margin: 0 20px; color: var(--text-secondary); }
    .product-price { font-size: 1.3rem; font-weight: 800; margin: 12px 20px; color: var(--accent-dark); }
    
    /* Modal Product Page */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: 0.25s;
    }
    .modal.open { visibility: visible; opacity: 1; }
    .modal-content {
      background: var(--card-bg);
      max-width: 550px;
      width: 90%;
      border-radius: 48px;
      padding: 32px;
      position: relative;
      border: 2px solid var(--accent-pink);
      animation: zoomFade 0.3s ease;
    }
    .close-modal {
      position: absolute;
      left: 20px;
      top: 20px;
      font-size: 28px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .size-selector { display: flex; gap: 16px; margin: 20px 0; }
    .size-opt {
      background: var(--bg-secondary);
      padding: 10px 20px;
      border-radius: 40px;
      cursor: pointer;
      border: 1px solid var(--border-color);
    }
    .size-opt.active { background: var(--accent-dark); color: var(--accent-gold); }
    .qty-control { display: flex; align-items: center; gap: 15px; margin: 20px 0; }
    .qty-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-gold);
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
    }
    .add-to-cart {
      width: 100%;
      background: var(--accent-dark);
      color: var(--accent-gold);
      padding: 16px;
      border: none;
      border-radius: 60px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
      transition: var(--transition);
    }
    .add-to-cart:hover { background: var(--accent-pink); color: var(--accent-dark); }

    /* Cart Drawer */
    .cart-drawer {
      position: fixed;
      top: 0;
      left: -450px;
      width: 450px;
      height: 100%;
      background: var(--card-bg);
      z-index: 400;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
    }
    .cart-drawer.open { left: 0; }
    .cart-header { padding: 24px; border-bottom: 2px solid var(--border-color); display: flex; justify-content: space-between; }
    .cart-items { flex: 1; overflow: auto; padding: 20px; }
    .cart-footer { padding: 24px; border-top: 2px solid var(--border-color); }
    .payment-icons { display: flex; gap: 12px; margin: 15px 0; }
    .payment-icons span { background: var(--bg-secondary); padding: 8px 16px; border-radius: 40px; font-size: 0.8rem; }
    .whatsapp-order {
      background: #25D366;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 60px;
      color: white;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 40px 20px;
      border-top: 1px solid var(--border-color);
      margin-top: 50px;
    }
    .social-links { display: flex; justify-content: center; gap: 25px; margin-bottom: 20px; flex-wrap: wrap; }
    .social-link {
      color: var(--text-secondary);
      font-size: 1.5rem;
      transition: var(--transition);
    }
    .social-link:hover { transform: translateY(-3px); color: var(--accent-pink); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes zoomFade { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @media (max-width: 680px) {
      .container { padding: 0 20px; }
      .cart-drawer { width: 100%; }
      .hero h2 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<button class="scroll-top" id="scrollTopBtn"><i class="fas fa-arrow-up"></i></button>

<div class="header">

<!-- Product Modal -->
<div class="modal" id="productModal"><div class="modal-content"><button class="close-modal" id="closeModal"><i class="fas fa-times"></i></button><div id="modalBody"></div></div></div>

<!-- Cart Drawer -->
<div class="cart-drawer" id="cartDrawer"><div class="cart-header"><span><i class="fas fa-shopping-bag"></i> My Cart</span><button id="closeCart" style="background:none; border:none; font-size:1.5rem;"><i class="fas fa-times"></i></button></div><div class="cart-items" id="cartItemsList"></div><div class="cart-footer"><div style="display:flex; justify-content:space-between; font-weight:800;"><span>Total</span><span id="cartTotal">0 EGP</span></div><div class="payment-icons"><span><i class="fab fa-vodafone"></i> Vodafone Cash</span><span><i class="fas fa-mobile-alt"></i> InstaPay</span></div><button class="whatsapp-order" id="whatsappBtn"><i class="fab fa-whatsapp"></i> Confirm Order via WhatsApp</button></div></div>

<footer>
  <div class="social-links">
    <a href="https://www.instagram.com/swyrbeauty/" target="_blank" class="social-link"><i class="fab fa-instagram"></i></a>
    <a href="https://www.tiktok.com/@swyrperfumes" target="_blank" class="social-link"><i class="fab fa-tiktok"></i></a>
    <a href="https://www.facebook.com/people/SWYR/61563925810810/" target="_blank" class="social-link"><i class="fab fa-facebook"></i></a>

</footer>

<script>
  const products = [
    { id:1, name:"Sea Passion", nameAr:"سي باشن", desc:"Inspired by Mediterranean breezes. A tropical, long-lasting blend with a touch of SWYR freshness.", descAr:"مستوحى من نسيم البحر المتوسط. مزيج استوائي يدوم طويلاً مع لمسة SWYR المنعشة.", price50:300, price100:550, badge:"Offer", badgeAr:"عرض" },
    { id:2, name:"Black Lacoste", nameAr:"بلاك لاكوست", desc:"Sporty elegance with citrus freshness. SWYR touch: all-day performance.", descAr:"أناقة رياضية بنضارة حمضيات. لمسة SWYR: أداء طوال اليوم.", price50:300, price100:550, badge:"Best Seller", badgeAr:"الأكثر مبيعاً" },
    { id:3, name:"212 Sexy", nameAr:"212 سكسي", desc:"Floral irresistible charm. SWYR touch: oriental softness.", descAr:"سحر زهري لا يقاوم. لمسة SWYR: نعومة شرقية.", price50:300, price100:550, badge:null },
    { id:4, name:"Gucci Flora", nameAr:"جوتشي فلورا", desc:"Enchanting Italian gardens. SWYR touch: modern femininity.", descAr:"حدائق إيطالية ساحرة. لمسة SWYR: أنوثة عصرية.", price50:300, price100:550, badge:"-40%", badgeAr:"تخفيض" },
    { id:5, name:"Crystal Noir", nameAr:"كريستال نوار", desc:"Musk & amber royalty. SWYR touch: mysterious nights.", descAr:"فخامة المسك والعنبر. لمسة SWYR: ليالي غامضة.", price50:300, price100:550, badge:null },
    { id:6, name:"Idôle Lancôme", nameAr:"ايدول لانكوم", desc:"Modern woman power with rose. SWYR touch: confidence in a bottle.", descAr:"قوة المرأة العصرية بالورد. لمسة SWYR: ثقة في زجاجة.", price50:300, price100:550, badge:"Most Wanted", badgeAr:"الأكثر طلباً" },
    { id:7, name:"Stronger With You", nameAr:"سترونجر ويذ يو", desc:"Warm woods & spices. SWYR touch: bold masculinity.", descAr:"أخشاب دافئة وتوابل. لمسة SWYR: رجولة جريئة.", price50:300, price100:550, badge:null },
    { id:8, name:"Libre", nameAr:"ليبر", desc:"Vanilla freedom. SWYR touch: artistic fragrance.", descAr:"حرية الفانيليا. لمسة SWYR: عطر فني.", price50:300, price100:550, badge:"Special", badgeAr:"عرض خاص" },
    { id:9, name:"Good Girl", nameAr:"جود جيرل", desc:"Almond seduction. SWYR touch: pure beauty.", descAr:"إغراء اللوز. لمسة SWYR: جمال خالص.", price50:300, price100:550, badge:null },
    { id:10, name:"Sauvage", nameAr:"سوفاج", desc:"Desert & cacti icon. SWYR touch: freedom & strength.", descAr:"أيقونة الصحراء والصبار. لمسة SWYR: حرية وقوة.", price50:300, price100:550, badge:"Legendary", badgeAr:"أسطوري" },
    { id:11, name:"Imperial Story", nameAr:"قصة امبريال", desc:"Royal cedar wood. SWYR touch: majestic luxury.", descAr:"خشب الأرز الملكي. لمسة SWYR: فخامة ملكية.", price50:300, price100:550, badge:null },
    { id:12, name:"Poison Girl", nameAr:"بويزن جيرل", desc:"Sweet poison charm. SWYR touch: bold & unforgettable.", descAr:"سحر سام حلو. لمسة SWYR: جريء لا يُنسى.", price50:300, price100:550, badge:null },
    { id:13, name:"Scandal", nameAr:"سكاندل", desc:"French audacity. SWYR touch: beautiful scandal.", descAr:"جرأة فرنسية. لمسة SWYR: فضيحة جميلة.", price50:300, price100:550, badge:"New", badgeAr:"جديد" },
    { id:14, name:"Black Opium", nameAr:"بلاك أوبيوم", desc:"Coffee & vanilla addiction. SWYR touch: unforgettable nights.", descAr:"إدمان القهوة والفانيليا. لمسة SWYR: ليالي لا تنسى.", price50:300, price100:550, badge:"Best Seller", badgeAr:"الأكثر مبيعاً" },
    { id:15, name:"La Vie Est Belle", nameAr:"لافي بيل", desc:"Beautiful life with white flowers. SWYR touch: happiness in every spray.", descAr:"حياة جميلة بأزهار بيضاء. لمسة SWYR: سعادة في كل رشة.", price50:300, price100:550, badge:null }
  ];

  let cart = [], isDark = false, isArabic = false, currentProduct = null, currentSize = "50ml", currentQty = 1;
  function savePrefs() { localStorage.setItem('swyr_dark', isDark); localStorage.setItem('swyr_lang', isArabic); }
  function loadPrefs() { isDark = localStorage.getItem('swyr_dark') === 'true'; isArabic = localStorage.getItem('swyr_lang') === 'true'; applyTheme(); applyLanguage(); }

  function applyTheme() { document.body.classList.toggle('dark', isDark); document.getElementById('darkModeText').innerText = isDark ? 'Light' : 'داكن'; }
  function applyLanguage() {
    document.getElementById('langText').innerText = isArabic ? 'عربي' : 'English';
    document.getElementById('heroTitle').innerText = isArabic ? 'اكتشف توقيعك العطري' : 'Discover Your Signature Scent';
    document.getElementById('heroSub').innerHTML = isArabic ? 'عطور فاخرة مستوحاة. ناعمة، أنيقة، شخصية بعمق.' : 'Luxury inspired perfumes. Soft, elegant, deeply personal.';
    renderProducts();
  }

  function renderProducts() {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = products.map(p => `
      <div class="product-card" data-id="${p.id}">
        ${(isArabic ? p.badgeAr : p.badge) ? `<div class="badge">${isArabic ? p.badgeAr : p.badge}</div>` : ''}
        <div class="product-img"><svg viewBox="0 0 100 100"><rect x="25" y="28" width="50" height="52" rx="12" fill="#ffb3db80" stroke="var(--accent-dark)" stroke-width="1.5"/><rect x="35" y="18" width="30" height="15" rx="6" fill="#f7df92"/><circle cx="50" cy="60" r="9" fill="var(--accent-dark)"/></svg></div>
        <div class="product-title">${isArabic ? p.nameAr : p.name}</div>
        <div class="product-price">${isArabic ? 'من 300 ج.م' : 'from 300 EGP'}</div>
      </div>
    `).join('');
    document.querySelectorAll('.product-card').forEach(card => card.addEventListener('click', () => showProductModal(parseInt(card.dataset.id))));
  }

  function showProductModal(id) {
    currentProduct = products.find(p => p.id === id); currentSize = "50ml"; currentQty = 1; updateModal();
    document.getElementById('productModal').classList.add('open');
  }
  function updateModal() {
    if (!currentProduct) return;
    const price = currentSize === "50ml" ? currentProduct.price50 : currentProduct.price100;
    document.getElementById('modalBody').innerHTML = `
      <h2 style="color:var(--text-secondary)">${isArabic ? currentProduct.nameAr : currentProduct.name}</h2>
      <p style="margin:15px 0; line-height:1.6">${isArabic ? currentProduct.descAr : currentProduct.desc}</p>
      <div class="size-selector"><div class="size-opt ${currentSize==='50ml'?'active':''}" data-size="50ml">50ml - ${currentProduct.price50} ${isArabic ? 'ج.م' : 'EGP'}</div><div class="size-opt ${currentSize==='100ml'?'active':''}" data-size="100ml">100ml - ${currentProduct.price100} ${isArabic ? 'ج.م' : 'EGP'}</div></div>
      <div class="qty-control"><button class="qty-btn" id="qtyMinus">-</button><span style="font-size:1.3rem; min-width:50px; text-align:center">${currentQty}</span><button class="qty-btn" id="qtyPlus">+</button><span style="margin-right:auto">${isArabic ? 'الكمية' : 'Quantity'}</span></div>
      <div style="font-size:1.8rem; font-weight:800; margin:20px 0">${price * currentQty} ${isArabic ? 'ج.م' : 'EGP'}</div>
      <button class="add-to-cart" id="modalAddCart"><i class="fas fa-cart-plus"></i> ${isArabic ? 'أضف إلى السلة' : 'Add to Cart'}</button>
    `;
    document.querySelectorAll('.size-opt').forEach(opt => opt.addEventListener('click', (e) => { currentSize = opt.dataset.size; updateModal(); }));
    document.getElementById('qtyMinus')?.addEventListener('click', () => { if(currentQty>1) currentQty--; updateModal(); });
    document.getElementById('qtyPlus')?.addEventListener('click', () => { currentQty++; updateModal(); });
    document.getElementById('modalAddCart')?.addEventListener('click', () => { addToCart(currentProduct.id, `${isArabic ? currentProduct.nameAr : currentProduct.name} (${currentSize})`, currentSize === "50ml" ? currentProduct.price50 : currentProduct.price100, currentSize, currentQty); document.getElementById('productModal').classList.remove('open'); });
  }
  function addToCart(id, name, price, size, qty) { let idx = cart.findIndex(i => i.id === id && i.size === size); idx !== -1 ? cart[idx].quantity += qty : cart.push({ id, name, price, quantity: qty, size }); updateCart(); showNotif(`Added ${name}`); }
  function updateCart() { let total = 0, count = 0; cart.forEach(i => { total += i.price * i.quantity; count += i.quantity; }); document.getElementById('cartCount').innerText = count; document.getElementById('cartTotal').innerHTML = total + ' EGP'; let html = cart.length === 0 ? '<div style="text-align:center">Cart empty</div>' : cart.map((i, idx) => `<div style="display:flex; justify-content:space-between; margin-bottom:15px;"><div><strong>${i.name}</strong><br>${i.price} EGP x ${i.quantity}</div><button class="remove-item" data-idx="${idx}" style="background:var(--accent-gold); border:none; border-radius:30px; padding:5px 12px;"><i class="fas fa-trash"></i></button></div>`).join(''); document.getElementById('cartItemsList').innerHTML = html; document.querySelectorAll('.remove-item').forEach(btn => btn.addEventListener('click', (e) => { cart.splice(parseInt(btn.dataset.idx), 1); updateCart(); })); }
  function showNotif(msg) { let d = document.createElement('div'); d.innerText = msg; d.style.cssText = 'position:fixed;bottom:20px;right:20px;background:var(--accent-dark);color:var(--accent-gold);padding:12px 24px;border-radius:40px;z-index:500'; document.body.appendChild(d); setTimeout(() => d.remove(), 2000); }

  // Event Listeners & Scroll
  document.getElementById('darkModeToggle').addEventListener('click', () => { isDark = !isDark; applyTheme(); savePrefs(); });
  document.getElementById('langToggle').addEventListener('click', () => { isArabic = !isArabic; applyLanguage(); savePrefs(); });
  document.getElementById('cartIcon').addEventListener('click', () => document.getElementById('cartDrawer').classList.add('open'));
  document.getElementById('closeCart').addEventListener('click', () => document.getElementById('cartDrawer').classList.remove('open'));
  document.getElementById('closeModal').addEventListener('click', () => document.getElementById('productModal').classList.remove('open'));
  document.getElementById('whatsappBtn').addEventListener('click', () => { if(!cart.length) return alert('Cart empty'); let msg = `New SWYR Order:\n`; cart.forEach(i => msg += `${i.name} x${i.quantity} = ${i.price*i.quantity} EGP\n`); msg += `Total: ${cart.reduce((s,i)=>s+i.price*i.quantity,0)} EGP\nPayment: Vodafone Cash / InstaPay`; window.open(`https://wa.me/201234567890?text=${encodeURIComponent(msg)}`, '_blank'); });
  window.addEventListener('scroll', () => { document.getElementById('scrollTopBtn').classList.toggle('show', window.scrollY > 300); });
  document.getElementById('scrollTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  loadPrefs(); renderProducts(); updateCart();
</script>
