    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Color Variables - SWYR Premium Palette */
    :root {
      --gold: #D4AF37;
      --gold-dark: #B8902C;
      --pink: #E8B4B8;
      --pink-dark: #C88A8F;
      --brown: #4A3525;
      --brown-light: #6B4C3A;
      --gray: #5A6570;
      --bg-light: #FDF9F2;
      --card-light: #FFFFFF;
      --shadow-sm: 0 10px 25px rgba(0,0,0,0.05);
      --shadow-md: 0 20px 35px rgba(0,0,0,0.08);
      --shadow-lg: 0 25px 45px rgba(0,0,0,0.12);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    body.dark {
      --bg-light: #121212;
      --card-light: #1E1E2A;
      --brown: #F0EAD6;
      --brown-light: #D6C8B3;
      --shadow-sm: 0 10px 25px rgba(0,0,0,0.2);
      --shadow-md: 0 20px 35px rgba(0,0,0,0.3);
      --shadow-lg: 0 25px 45px rgba(0,0,0,0.4);
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--bg-light);
      color: var(--brown);
      transition: var(--transition);
      scroll-behavior: smooth;
    }

    /* Custom Scroll */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--pink); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 32px;
    }

    /* Header with Blur & Gradient */
    .header {
      background: rgba(var(--bg-light-rgb), 0.92);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 0;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
      box-shadow: 0 2px 20px rgba(0,0,0,0.03);
    }
    .header-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    .logo h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--gold), var(--pink), var(--brown));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: var(--card-light);
      border-radius: 60px;
      padding: 10px 24px;
      width: 300px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(212, 175, 55, 0.3);
      transition: var(--transition);
    }
    .search-box:focus-within { box-shadow: 0 0 0 3px var(--gold); }
    .search-box input {
      background: transparent;
      border: none;
      flex: 1;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      color: var(--brown);
    }
    .search-box i { color: var(--gold); }
    .header-actions {
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .icon-btn {
      background: var(--card-light);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(212, 175, 55, 0.3);
      color: var(--brown);
    }
    .icon-btn:hover {
      transform: translateY(-3px);
      background: var(--gold);
      color: var(--card-light);
    }
    .cart-icon { position: relative; }
    .cart-count {
      position: absolute;
      top: -6px;
      right: -6px;
      background: var(--gold);
      color: var(--brown);
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Hero Slider */
    .hero-slider {
      margin: 40px 0 60px;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    .swiper-slide {
      background: linear-gradient(125deg, var(--pink)15, var(--gold)10, var(--bg-light)70);
      padding: 70px 40px;
      text-align: center;
      border-radius: 40px;
    }
    .swiper-slide img {
      width: 180px;
      height: auto;
      border-radius: 30px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 20px;
    }
    .swiper-slide h3 {
      font-size: 2rem;
      background: linear-gradient(135deg, var(--gold), var(--brown));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    /* Layout */
    .shop-layout {
      display: flex;
      gap: 35px;
      margin: 40px 0;
    }
    /* Sidebar Filters */
    .filters-sidebar {
      width: 280px;
      flex-shrink: 0;
      background: var(--card-light);
      border-radius: 32px;
      padding: 28px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(212, 175, 55, 0.2);
      align-self: start;
      position: sticky;
      top: 100px;
    }
    .filter-section {
      margin-bottom: 30px;
    }
    .filter-title {
      font-weight: 800;
      margin-bottom: 18px;
      font-size: 1.1rem;
      border-right: 3px solid var(--gold);
      padding-right: 12px;
    }
    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--pink);
      padding: 8px 16px;
      border-radius: 60px;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--brown);
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--gold);
      border-color: var(--gold);
      color: var(--card-light);
      transform: translateY(-2px);
    }

    /* Products Main */
    .products-main {
      flex: 1;
    }
    .trend-section {
      background: linear-gradient(125deg, var(--gold)10, var(--pink)15, transparent);
      border-radius: 32px;
      padding: 30px;
      margin-bottom: 40px;
    }
    .trend-title {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 25px;
      position: relative;
      display: inline-block;
    }
    .trend-title:after {
      content: '';
      position: absolute;
      bottom: -8px;
      right: 0;
      width: 60px;
      height: 3px;
      background: var(--gold);
    }
    .trend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
    }
    .trend-item {
      background: var(--card-light);
      border-radius: 24px;
      padding: 20px;
      text-align: center;
      transition: var(--transition);
      cursor: pointer;
    }
    .trend-item:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-md);
    }
    .trend-item img {
      width: 100%;
      max-width: 120px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .main-category {
      margin-bottom: 50px;
    }
    .category-title {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-right: 4px solid var(--gold);
      padding-right: 18px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 30px;
    }
    .product-card {
      background: var(--card-light);
      border-radius: 28px;
      overflow: hidden;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-color: var(--gold);
    }
    .product-img {
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-light);
      padding: 20px;
    }
    .product-img img {
      max-width: 80%;
      max-height: 80%;
      transition: transform 0.5s;
    }
    .product-card:hover .product-img img { transform: scale(1.02); }
    .product-info {
      padding: 20px;
    }
    .product-title {
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 5px;
    }
    .product-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--gold);
      margin: 10px 0;
    }
    .product-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .badge-tag {
      background: var(--pink);
      color: var(--brown);
      font-size: 0.7rem;
      padding: 4px 12px;
      border-radius: 30px;
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      opacity: 0;
      transition: 0.25s;
    }
    .modal.open { visibility: visible; opacity: 1; }
    .modal-content {
      background: var(--card-light);
      max-width: 650px;
      width: 90%;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 48px;
      padding: 32px;
      position: relative;
      border-top: 6px solid var(--gold);
    }
    .close-modal {
      position: absolute;
      top: 20px;
      left: 24px;
      width: 40px;
      height: 40px;
      background: var(--pink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }
    .close-modal:hover { background: var(--gold); }
    .size-selector { display: flex; gap: 15px; margin: 25px 0; flex-wrap: wrap; }
    .size-opt {
      padding: 10px 24px;
      border-radius: 60px;
      background: var(--bg-light);
      border: 1px solid var(--pink);
      cursor: pointer;
      transition: 0.2s;
    }
    .size-opt.active { background: var(--gold); color: var(--card-light); border-color: var(--gold); }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 25px 0;
    }
    .qty-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--gold);
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
    }

    /* Cart Drawer */
    .cart-drawer {
      position: fixed;
      top: 0;
      left: -450px;
      width: 420px;
      height: 100%;
      background: var(--card-light);
      z-index: 1100;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -8px 0 30px rgba(0,0,0,0.2);
    }
    .cart-drawer.open { left: 0; }
    .cart-header { padding: 24px; border-bottom: 1px solid var(--pink); display: flex; justify-content: space-between; font-weight: 800; }
    .cart-items { flex: 1; overflow: auto; padding: 20px; }
    .cart-footer { padding: 24px; border-top: 1px solid var(--pink); }
    .whatsapp-btn {
      background: #25D366;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 60px;
      color: white;
      font-weight: bold;
      margin-top: 12px;
      cursor: pointer;
    }

    /* Scroll Top */
    .scroll-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: 0.2s;
      z-index: 99;
      box-shadow: var(--shadow-md);
    }
    .scroll-top.show { opacity: 1; }
    .scroll-top:hover { transform: translateY(-3px); background: var(--gold-dark); }

    footer {

      padding: 50px 20px 30px;
      border-top: 1px solid var(--pink);
      margin-top: 70px;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 28px;

    .social-link {
      font-size: 1.6rem;
      color: var(--gray);
      transition: var(--transition);
    }
    .social-link:hover { color: var(--gold); transform: translateY(-3px); }

    @media (max-width: 1000px) {
      .shop-layout { flex-direction: column; }
      .filters-sidebar { width: 100%; position: static; }
      .container { padding: 0 20px; }
    }
  </style>
</head>

    { id:10, name:"سي كيه ون", nameEn:"CK One", cat:"unisex", types:["floral","aquatic"], price50:300, price100:550, desc:"حيادي منعش مع الأناناس، الياسمين، والمسك. عطر يومي خفيف.", img:"https://fimgs.net/mdimg/perfume/375x500.219.jpg", trend:true },
    { id:11, name:"شغاف عود", nameEn:"Shaghaf Oud", cat:"unisex", types:["oud","oriental"], price50:300, price100:550, desc:"عود شرقي أسطوري مع الزعفران، الورد، وخشب العود. ثابت وفواح جداً.", img:"https://fimgs.net/mdimg/perfume/375x500.23385.jpg", trend:false },
    { id:12, name:"مسك أبيض", nameEn:"White Musk", cat:"unisex", types:["musk","floral"], price50:300, price100:550, desc:"نقاء المسك الأبيض مع الليمون، زهر البرتقال، وخشب الأرز.", img:"https://fimgs.net/mdimg/perfume/375x500.1526.jpg", trend:false },
    { id:13, name:"ديلينا", nameEn:"Delina", cat:"women", types:["floral","fruity"], price50:300, price100:550, desc:"أناقة الورد والليتشي مع المسك والفانيليا. عطر زهري فاخر.", img:"https://fimgs.net/mdimg/perfume/375x500.22548.jpg", trend:true },
    { id:14, name:"عود إصفهان", nameEn:"Oud Ispahan", cat:"unisex", types:["oud","rose"], price50:300, price100:550, desc:"عود وورد في توليفة شرقية ساحرة. يدوم لأكثر من 10 ساعات.", img:"https://fimgs.net/mdimg/perfume/375x500.14238.jpg", trend:false },
    { id:15, name:"تيري دي هيرميس", nameEn:"Terre d'Hermès", cat:"men", types:["woody","spicy"], price50:300, price100:550, desc:"ترابي وخشبي مع البرتقال، الفلفل، وخشب الأرز.", img:"https://fimgs.net/mdimg/perfume/375x500.369.jpg", trend:true }
  ];

  // Cart & State
  let cart = [];
  let isDark = localStorage.getItem('swyr_dark') === 'true';
  let currentMain = "all";
  let currentSub = "all";
  let searchTerm = "";

  // Helper functions
  function applyTheme() { document.body.classList.toggle('dark', isDark); localStorage.setItem('swyr_dark', isDark); }
  function filterProducts() {
    return products.filter(p => 
      (currentMain === 'all' || p.cat === currentMain) &&
      (currentSub === 'all' || p.types.includes(currentSub)) &&
      (searchTerm === '' || p.name.includes(searchTerm) || p.desc.includes(searchTerm))
    );
  }

  // Render Hero Slider
  function renderHeroSlider() {
    const trending = products.filter(p => p.trend).slice(0, 5);
    const slides = trending.map(p => `
      <div class="swiper-slide">
        <img src="${p.img}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p>${p.desc.substring(0, 80)}...</p>
      </div>
    `).join('');
    document.getElementById('heroSlider').innerHTML = slides;
    new Swiper('.hero-slider', { loop: true, autoplay: { delay: 4000 }, pagination: { el: '.swiper-pagination' } });
  }

  // Render Trend Grid
  function renderTrend() {
    const trendProducts = products.filter(p => p.trend).slice(0, 8);
    document.getElementById('trendGrid').innerHTML = trendProducts.map(p => `
      <div class="trend-item" data-id="${p.id}">
        <img src="${p.img}" alt="${p.name}" style="width:100%; border-radius:16px;">
        <div class="product-title" style="margin-top:12px;">${p.name}</div>
        <div class="product-price">من ${p.price50} ج.م</div>
      </div>
    `).join('');
    document.querySelectorAll('.trend-item').forEach(el => el.addEventListener('click', () => showProductModal(parseInt(el.dataset.id))));
  }

  // Render Products (Men, Women, Unisex)
  function renderProducts() {
    const filtered = filterProducts();
    const men = filtered.filter(p => p.cat === 'men');
    const women = filtered.filter(p => p.cat === 'women');
    const unisex = filtered.filter(p => p.cat === 'unisex');
    const html = `
      <div class="main-category"><div class="category-title"><i class="fas fa-user"></i> عطور رجالية</div><div class="products-grid">${renderProductCards(men)}</div></div>
      <div class="main-category"><div class="category-title"><i class="fas fa-venus"></i> عطور نسائية</div><div class="products-grid">${renderProductCards(women)}</div></div>
      <div class="main-category"><div class="category-title"><i class="fas fa-venus-mars"></i> عطور للجنسين</div><div class="products-grid">${renderProductCards(unisex)}</div></div>
    `;
    document.getElementById('mainContent').innerHTML = html;
    document.querySelectorAll('.product-card').forEach(card => card.addEventListener('click', () => showProductModal(parseInt(card.dataset.id))));
  }

  function renderProductCards(productsList) {
    return productsList.map(p => `
      <div class="product-card" data-id="${p.id}">
        <div class="product-img"><img src="${p.img}" alt="${p.name}"></div>
        <div class="product-info">
          <div class="product-title">${p.name}</div>
          <div class="product-price">${p.price50} ج.م</div>
          <div class="product-badges">${p.types.slice(0,2).map(t => `<span class="badge-tag">${getTypeName(t)}</span>`).join('')}</div>
        </div>
      </div>
    `).join('');
  }

  function getTypeName(t) {
    const names = { floral:"زهري", oud:"عود", musk:"مسك", spicy:"توابل", fruity:"فاكهي", aquatic:"بحري", oriental:"شرقي", leather:"جلدي", woody:"خشبي", gourmand:"حلوى" };
    return names[t] || t;
  }

  // Modal Logic
  let currentProduct = null, currentSize = "50ml", currentQty = 1;
  function showProductModal(id) {
    currentProduct = products.find(p => p.id === id);
    currentSize = "50ml";
    currentQty = 1;
    updateModalContent();
    document.getElementById('productModal').classList.add('open');
  }
  function updateModalContent() {
    if (!currentProduct) return;
    const price = currentSize === "50ml" ? currentProduct.price50 : currentProduct.price100;
    const modalDiv = document.getElementById('modalDynamicContent');
    modalDiv.innerHTML = `
      <div style="text-align:center;">
        <img src="${currentProduct.img}" style="width:150px; border-radius:24px; margin-bottom:20px;">
      </div>
      <div style="font-size:1.8rem; font-weight:800;">${currentProduct.name}</div>
      <div style="margin:15px 0; line-height:1.7;">${currentProduct.desc}</div>
      <div class="size-selector">
        <div class="size-opt ${currentSize === '50ml' ? 'active' : ''}" data-size="50ml">50 مل - ${currentProduct.price50} ج.م</div>
        <div class="size-opt ${currentSize === '100ml' ? 'active' : ''}" data-size="100ml">100 مل - ${currentProduct.price100} ج.م</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" id="modalQtyMinus">-</button>
        <span style="font-size:1.3rem; min-width:40px; text-align:center;">${currentQty}</span>
        <button class="qty-btn" id="modalQtyPlus">+</button>
        <span style="margin-right:auto;">الكمية</span>
      </div>
      <div style="font-size:1.8rem; font-weight:800; margin:15px 0;">${price * currentQty} ج.م</div>
      <button class="add-to-cart-modal" id="modalAddCartBtn" style="background:var(--gold); width:100%; padding:14px; border:none; border-radius:60px; font-weight:bold;">أضف إلى السلة</button>
    `;
    document.querySelectorAll('.size-opt').forEach(opt => opt.addEventListener('click', (e) => { currentSize = opt.dataset.size; updateModalContent(); }));
    document.getElementById('modalQtyMinus')?.addEventListener('click', () => { if(currentQty>1) currentQty--; updateModalContent(); });
    document.getElementById('modalQtyPlus')?.addEventListener('click', () => { currentQty++; updateModalContent(); });
    document.getElementById('modalAddCartBtn')?.addEventListener('click', () => { addToCart(currentProduct.id, `${currentProduct.name} (${currentSize})`, price, currentSize, currentQty); document.getElementById('productModal').classList.remove('open'); });
  }

  // Cart Functions
  function addToCart(id, name, price, size, qty) {
    const idx = cart.findIndex(i => i.id === id && i.size === size);
    if (idx !== -1) cart[idx].quantity += qty;
    else cart.push({ id, name, price, quantity: qty, size });
    updateCartUI();
    showNotification(`تم إضافة ${name}`);
  }
  function updateCartUI() {
    const totalQty = cart.reduce((s,i) => s + i.quantity, 0);
    const totalPrice = cart.reduce((s,i) => s + i.price * i.quantity, 0);
    document.getElementById('cartCount').innerText = totalQty;
    document.getElementById('cartTotal').innerHTML = totalPrice + ' ج.م';
    if (cart.length === 0) { document.getElementById('cartItemsList').innerHTML = '<div style="text-align:center;">سلة فارغة</div>'; return; }
    document.getElementById('cartItemsList').innerHTML = cart.map((item, idx) => `
      <div style="display:flex; justify-content:space-between; margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid var(--pink);">
        <div><strong>${item.name}</strong><br>${item.price} ج.م × ${item.quantity}</div>
        <button class="remove-item" data-idx="${idx}" style="background:var(--pink); border:none; border-radius:50%; width:32px; height:32px; cursor:pointer;"><i class="fas fa-trash"></i></button>
      </div>
    `).join('');
    document.querySelectorAll('.remove-item').forEach(btn => btn.addEventListener('click', (e) => { cart.splice(parseInt(btn.dataset.idx), 1); updateCartUI(); }));
  }
  function showNotification(msg) {
    let notif = document.createElement('div');
    notif.innerText = msg;
    notif.style.cssText = 'position:fixed;bottom:20px;right:20px;background:var(--gold);color:var(--brown);padding:12px 24px;border-radius:50px;z-index:1200;font-weight:bold;box-shadow:var(--shadow-md);';
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 2500);
  }

  // Event Listeners
  document.getElementById('darkModeToggle').addEventListener('click', () => { isDark = !isDark; applyTheme(); });
  document.getElementById('cartIcon').addEventListener('click', () => document.getElementById('cartDrawer').classList.add('open'));
  document.getElementById('closeCartBtn').addEventListener('click', () => document.getElementById('cartDrawer').classList.remove('open'));
  document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('productModal').classList.remove('open'));
  document.getElementById('productModal').addEventListener('click', (e) => { if(e.target === document.getElementById('productModal')) document.getElementById('productModal').classList.remove('open'); });
  document.getElementById('whatsappOrderBtn').addEventListener('click', () => {
    if(cart.length === 0) { alert('السلة فارغة'); return; }
    let msg = `طلب جديد من SWYR:\n`;
    cart.forEach(i => msg += `- ${i.name} × ${i.quantity} = ${i.price * i.quantity} ج.م\n`);
    msg += `الإجمالي: ${cart.reduce((s,i)=>s+i.price*i.quantity,0)} ج.م\nطرق الدفع: فودافون كاش أو إنستاباي`;
    window.open(`https://wa.me/201234567890?text=${encodeURIComponent(msg)}`, '_blank');
  });
  document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; renderProducts(); });
  document.querySelectorAll('#mainCatFilters .filter-btn').forEach(btn => btn.addEventListener('click', (e) => {
    document.querySelectorAll('#mainCatFilters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMain = btn.dataset.main;
    renderProducts();
  }));
  document.querySelectorAll('#subCatFilters .filter-btn').forEach(btn => btn.addEventListener('click', (e) => {
    document.querySelectorAll('#subCatFilters .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSub = btn.dataset.sub;
    renderProducts();
  }));
  window.addEventListener('scroll', () => document.getElementById('scrollTop').classList.toggle('show', window.scrollY > 300));
  document.getElementById('scrollTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

  // Initialization
  applyTheme();
  renderHeroSlider();
  renderTrend();
  renderProducts();
  updateCartUI();
</script>
</body>
</html>
