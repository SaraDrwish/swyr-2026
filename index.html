    .cart-count {

      right: -6px;

      height: 20px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;

      transition: 0.3s;

      bottom: -8px;
      right: 0;
      width: 60px;
      height: 3px;
      background: var(--gold-dark);

      left: 0;

      justify-content: center;

      opacity: 0;

</head>

    { id:17, name:"Millesime Imperial", nameAr:"ميلسيم إمبريال", cat:"men", types:["aquatic","fruity"], price50:430, price100:800, desc:"ملكي ومنعش مع البطيخ، زهر البرتقال، والمسك. عطر صيفي فاخر.", descEn:"Royal and fresh with watermelon, orange blossom, and musk." },
    { id:18, name:"Light Blue", nameAr:"لايت بلو", cat:"women", types:["fruity","aquatic"], price50:290, price100:520, desc:"منعش صيفي مع التفاح، الأرز، وزهر البرتقال. عطر يومي خفيف.", descEn:"Summer fresh with apple, cedar, and orange blossom." },
    { id:19, name:"Spicebomb", nameAr:"سبايس بومب", cat:"men", types:["spicy","leather"], price50:360, price100:660, desc:"قنبلة توابل مع القرفة، الفلفل، والجلد. عطر قوي جداً.", descEn:"Spice explosion with cinnamon, pepper, and leather." },
    { id:20, name:"Flowerbomb", nameAr:"فلاور بومب", cat:"women", types:["floral","oriental"], price50:380, price100:700, desc:"قنبلة زهور مع الورد، الياسمين، والفانيليا. عطر زهري فواح.", descEn:"Flower explosion with rose, jasmine, and vanilla." },
    { id:21, name:"Club de Nuit", nameAr:"كلوب دي نوي", cat:"men", types:["fruity","leather"], price50:280, price100:500, desc:"قوي وحاد مع الليمون، التفاح، وخشب الأرز. عطر ثابت وفواح.", descEn:"Strong and sharp with lemon, apple, and cedarwood." },
    { id:22, name:"Si", nameAr:"سي", cat:"women", types:["floral","fruity"], price50:340, price100:610, desc:"أناقة إيطالية مع الكشمير، الورد، والفانيليا. عطر دافئ وجذاب.", descEn:"Italian elegance with cashmeran, rose, and vanilla." },
    { id:23, name:"Encre Noire", nameAr:"انكر نوار", cat:"men", types:["woody","dark"], price50:310, price100:560, desc:"عطر داكن وخشبي مع الباتشولي، خشب الأرز، والمسك. عطر غامض.", descEn:"Dark and woody with patchouli, cedarwood, and musk." },
    { id:24, name:"L'Interdit", nameAr:"لانتردي", cat:"women", types:["floral","spicy"], price50:370, price100:690, desc:"جريء وممنوع مع البنفسج، الورد، والفانيليا. عطر قوي الجاذبية.", descEn:"Bold and forbidden with violet, rose, and vanilla." },
    { id:25, name:"Aramis", nameAr:"اراميس", cat:"men", types:["leather","spicy"], price50:300, price100:540, desc:"كلاسيكي جلدي مع البرغموت، القرفة، والمسك. عطر رجالي بامتياز.", descEn:"Classic leather with bergamot, cinnamon, and musk." },
    { id:26, name:"Angel", nameAr:"انجل", cat:"women", types:["gourmand","oriental"], price50:360, price100:650, desc:"عطر ملاك مع الشوكولاتة، الكراميل، والباتشولي. حلو وفواح.", descEn:"Angel scent with chocolate, caramel, and patchouli." },
    { id:27, name:"Drakkar Noir", nameAr:"دراكار نوار", cat:"men", types:["aromatic","spicy"], price50:280, price100:490, desc:"عطر أسطوري مع الخزامى، إكليل الجبل، وخشب الأرز. عطر كلاسيكي.", descEn:"Legendary scent with lavender, rosemary, and cedarwood." },
    { id:28, name:"Hypnotic Poison", nameAr:"هيبنوتيك بويسون", cat:"women", types:["oriental","gourmand"], price50:390, price100:730, desc:"ساحر وجذاب مع اللوز، الفانيليا، والمسك. عطر ليلي لا يقاوم.", descEn:"Enchanting with almond, vanilla, and musk." },
    { id:29, name:"Bvlgari Man", nameAr:"بولغاري مان", cat:"men", types:["woody","aquatic"], price50:320, price100:580, desc:"عطر رجالي أنيق مع البرغموت، اللوتس، وخشب الأرز. عطر يومي ممتاز.", descEn:"Elegant men's scent with bergamot, lotus, and cedarwood." },
    { id:30, name:"Chance", nameAr:"شانس", cat:"women", types:["floral","citrus"], price50:350, price100:640, desc:"عطر الحظ مع الجريب فروت، الياسمين، والمسك. عطر منعش وجذاب.", descEn:"Lucky scent with grapefruit, jasmine, and musk." }
  ];

  // Trending products (most sold worldwide 2026)
  const trending = products.filter(p => [1,2,3,4,5,6,7,8].includes(p.id));

  // Type names mapping
  const typeNames = { floral:"زهري", oud:"عود", musk:"مسك", spicy:"توابل", fruity:"فاكهي", aquatic:"بحري", oriental:"شرقي", leather:"جلدي", woody:"خشبي", gourmand:"حلوى", aromatic:"عطري", citrus:"حمضيات", dark:"داكن" };

  // State
  let cart = [], isDark = false, isArabic = true, searchTerm = "", currentMainCat = "all", currentSubFilter = "all";
  
  // Helper functions
  function savePrefs() { localStorage.setItem('swyr_dark', isDark); localStorage.setItem('swyr_lang', isArabic); }
  function loadPrefs() { isDark = localStorage.getItem('swyr_dark') === 'true'; isArabic = localStorage.getItem('swyr_lang') === 'true'; applyTheme(); updateUI(); }
  function applyTheme() { document.body.classList.toggle('dark', isDark); savePrefs(); }
  function toggleLang() { isArabic = !isArabic; savePrefs(); updateUI(); renderFullSite(); renderTrending(); }
  function updateUI() {
    document.getElementById('heroTitle').innerText = isArabic ? "عطرك .. هويتك" : "Your Scent.. Your Identity";
    document.getElementById('heroDesc').innerHTML = isArabic ? "ليست مجرد عطور، بل تجربة حسية تعكس شخصيتك." : "Not just perfumes, but a sensory experience reflecting your personality.";
    document.getElementById('ctaText').innerText = isArabic ? "تسوق الآن" : "Shop Now";
    document.getElementById('trendTitle').innerText = isArabic ? "أكثر العطور مبيعاً عالمياً 2026" : "Best Selling Perfumes Worldwide 2026";
    document.getElementById('navMen').innerText = isArabic ? "رجالي" : "Men";
    document.getElementById('navWomen').innerText = isArabic ? "نسائي" : "Women";
    document.getElementById('navUnisex').innerText = isArabic ? "للجنسين" : "Unisex";
  }
  
  function renderTrending() {
    const grid = document.getElementById('trendGrid');
    grid.innerHTML = trending.map(p => `
      <div class="trend-card" data-id="${p.id}">
        <svg viewBox="0 0 100 100"><rect x="25" y="28" width="50" height="52" rx="12" fill="var(--pink)" stroke="var(--gold-dark)" stroke-width="1.5"/><rect x="35" y="18" width="30" height="15" rx="6" fill="var(--gold-light)"/><circle cx="50" cy="60" r="9" fill="var(--brown)"/></svg>
        <h4>${isArabic ? p.nameAr : p.name}</h4>
        <p>${p.price50} ج.م</p>
      </div>
    `).join('');
    document.querySelectorAll('.trend-card').forEach(card => card.addEventListener('click', () => showProductModal(parseInt(card.dataset.id))));
  }
  
  function renderFullSite() {
    let filtered = products.filter(p => 
      (currentMainCat === 'all' || p.cat === currentMainCat) &&
      (currentSubFilter === 'all' || p.types.includes(currentSubFilter)) &&
      (searchTerm === '' || (isArabic ? p.nameAr : p.name).includes(searchTerm) || p.desc.includes(searchTerm))
    );
    let menProducts = filtered.filter(p => p.cat === 'men');
    let womenProducts = filtered.filter(p => p.cat === 'women');
    let unisexProducts = filtered.filter(p => p.cat === 'unisex');
    
    const html = `
      <div id="men" class="main-category">
        <div class="category-title">${isArabic ? 'عطور رجالية' : 'Men Perfumes'}</div>
        <div class="sub-filters" data-cat="men"></div>
        <div class="products-grid" data-cat="men">${renderProductsHTML(menProducts)}</div>
      </div>
      <div id="women" class="main-category">
        <div class="category-title">${isArabic ? 'عطور نسائية' : 'Women Perfumes'}</div>
        <div class="sub-filters" data-cat="women"></div>
        <div class="products-grid" data-cat="women">${renderProductsHTML(womenProducts)}</div>
      </div>
      <div id="unisex" class="main-category">
        <div class="category-title">${isArabic ? 'عطور للجنسين' : 'Unisex Perfumes'}</div>
        <div class="sub-filters" data-cat="unisex"></div>
        <div class="products-grid" data-cat="unisex">${renderProductsHTML(unisexProducts)}</div>
      </div>
    `;
    document.getElementById('mainContent').innerHTML = html;
    
    // Attach filter buttons for each category
    document.querySelectorAll('.sub-filters').forEach(container => {
      const cat = container.dataset.cat;
      const typesAll = [...new Set(products.filter(p => p.cat === cat).flatMap(p => p.types))];
      container.innerHTML = `<button class="filter-btn ${currentSubFilter === 'all' ? 'active' : ''}" data-filter="all">${isArabic ? 'الكل' : 'All'}</button>` +
        typesAll.map(t => `<button class="filter-btn ${currentSubFilter === t ? 'active' : ''}" data-filter="${t}">${typeNames[t]}</button>`).join('');
      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          currentSubFilter = btn.dataset.filter;
          renderFullSite();
        });
      });
    });
    
    // Attach product click events
    document.querySelectorAll('.product-card').forEach(card => card.addEventListener('click', () => showProductModal(parseInt(card.dataset.id))));
  }
  
  function renderProductsHTML(productsList) {
    return productsList.map(p => `
      <div class="product-card" data-id="${p.id}">
        <div class="product-badges">${p.types.slice(0,3).map(t => `<span class="badge-tag">${typeNames[t]}</span>`).join('')}</div>
        <div class="product-img">
          <svg viewBox="0 0 100 100"><rect x="25" y="28" width="50" height="52" rx="12" fill="var(--pink)" stroke="var(--gold-dark)" stroke-width="1.5"/><rect x="35" y="18" width="30" height="15" rx="6" fill="var(--gold-light)"/><circle cx="50" cy="60" r="9" fill="var(--brown)"/></svg>
        </div>
        <div class="product-info">
          <div class="product-title">${isArabic ? p.nameAr : p.name}</div>
          <div class="product-price">${p.price50} ج.م</div>
        </div>
      </div>
    `).join('');
  }
  
  // Modal functions
  let currentProduct = null, currentSize = "50ml", currentQty = 1;
  function showProductModal(id) {
    currentProduct = products.find(p => p.id === id);
    currentSize = "50ml";
    currentQty = 1;
    updateModal();
    document.getElementById('productModal').classList.add('open');
  }
  function updateModal() {
    if (!currentProduct) return;
    const price = currentSize === "50ml" ? currentProduct.price50 : currentProduct.price100;
    document.getElementById('modalDynamicContent').innerHTML = `
      <div class="modal-title" style="font-size:1.8rem; font-weight:800;">${isArabic ? currentProduct.nameAr : currentProduct.name}</div>
      <div class="full-description" style="margin:20px 0; line-height:1.7;">${isArabic ? currentProduct.desc : currentProduct.descEn}</div>
      <div class="size-selector">
        <div class="size-opt ${currentSize === '50ml' ? 'active' : ''}" data-size="50ml">50 مل - ${currentProduct.price50} ج.م</div>
        <div class="size-opt ${currentSize === '100ml' ? 'active' : ''}" data-size="100ml">100 مل - ${currentProduct.price100} ج.م</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" id="modalQtyMinus">-</button>
        <span style="font-size:1.3rem; min-width:40px; text-align:center;">${currentQty}</span>
        <button class="qty-btn" id="modalQtyPlus">+</button>
        <span style="margin-right:auto;">الكمية</span>
      </div>
      <div style="font-size:1.8rem; font-weight:800; margin:20px 0;">${price * currentQty} ج.م</div>
      <button class="add-to-cart-modal" id="modalAddCartBtn">أضف إلى السلة</button>
    `;
    document.querySelectorAll('.size-opt').forEach(opt => opt.addEventListener('click', (e) => { currentSize = opt.dataset.size; updateModal(); }));
    document.getElementById('modalQtyMinus')?.addEventListener('click', () => { if(currentQty>1) currentQty--; updateModal(); });
    document.getElementById('modalQtyPlus')?.addEventListener('click', () => { currentQty++; updateModal(); });
    document.getElementById('modalAddCartBtn')?.addEventListener('click', () => { addToCart(currentProduct.id, `${isArabic ? currentProduct.nameAr : currentProduct.name} (${currentSize})`, price, currentSize, currentQty); document.getElementById('productModal').classList.remove('open'); });
  }
  
  // Cart functions
  function addToCart(id, name, price, size, qty) {
    let idx = cart.findIndex(i => i.id === id && i.size === size);
    if (idx !== -1) cart[idx].quantity += qty;
    else cart.push({ id, name, price, quantity: qty, size });
    updateCartUI();
    showNotif(`تم إضافة ${name}`);
  }
  function updateCartUI() {
    let totalQty = cart.reduce((s,i) => s + i.quantity, 0);
    let totalPrice = cart.reduce((s,i) => s + i.price * i.quantity, 0);
    document.getElementById('cartCount').innerText = totalQty;
    document.getElementById('cartTotal').innerHTML = totalPrice + ' ج.م';
    if(cart.length === 0) { document.getElementById('cartItemsList').innerHTML = '<div style="text-align:center;">سلة فارغة</div>'; return; }
    document.getElementById('cartItemsList').innerHTML = cart.map((item, idx) => `
      <div style="display:flex; justify-content:space-between; margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid var(--beige);">
        <div><strong>${item.name}</strong><br>${item.price} ج.م × ${item.quantity}</div>
        <button class="remove-item" data-idx="${idx}" style="background:var(--pink); border:none; border-radius:50px; width:32px; height:32px; cursor:pointer;">✖</button>
      </div>
    `).join('');
    document.querySelectorAll('.remove-item').forEach(btn => btn.addEventListener('click', (e) => { cart.splice(parseInt(btn.dataset.idx), 1); updateCartUI(); }));
  }
  function showNotif(msg) {
    let d = document.createElement('div');
    d.innerText = msg;
    d.style.cssText = 'position:fixed;bottom:20px;right:20px;background:var(--gold-dark);color:var(--brown);padding:12px 24px;border-radius:50px;z-index:1200;font-weight:bold;';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2500);
  }
  
  // Event Listeners
  document.getElementById('darkModeToggle').addEventListener('click', () => { isDark = !isDark; applyTheme(); });
  document.getElementById('langToggle').addEventListener('click', toggleLang);
  document.getElementById('cartIcon').addEventListener('click', () => document.getElementById('cartDrawer').classList.add('open'));
  document.getElementById('closeCartBtn').addEventListener('click', () => document.getElementById('cartDrawer').classList.remove('open'));
  document.getElementById('closeModalBtn').addEventListener('click', () => document.getElementById('productModal').classList.remove('open'));
  document.getElementById('whatsappOrderBtn').addEventListener('click', () => {
    if(cart.length === 0) { alert(isArabic ? 'السلة فارغة' : 'Cart is empty'); return; }
    let msg = `${isArabic ? 'طلب جديد من SWYR:' : 'New order from SWYR:'}\n`;
    cart.forEach(i => msg += `- ${i.name} × ${i.quantity} = ${i.price * i.quantity} ${isArabic ? 'ج.م' : 'EGP'}\n`);
    msg += `${isArabic ? 'الإجمالي: ' : 'Total: '}${cart.reduce((s,i)=>s+i.price*i.quantity,0)} ${isArabic ? 'ج.م' : 'EGP'}`;
    window.open(`https://wa.me/201234567890?text=${encodeURIComponent(msg)}`, '_blank');
  });
  document.getElementById('searchInput').addEventListener('input', (e) => { searchTerm = e.target.value; renderFullSite(); });
  document.getElementById('scrollToProducts').addEventListener('click', () => { document.getElementById('men').scrollIntoView({ behavior: 'smooth' }); });
  window.addEventListener('scroll', () => document.getElementById('scrollTop').classList.toggle('show', window.scrollY > 300));
  document.getElementById('scrollTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  
  // Close cart when clicking outside
  document.addEventListener('click', (e) => {
    const cartDrawer = document.getElementById('cartDrawer');
    const cartIcon = document.getElementById('cartIcon');
    if (!cartDrawer.contains(e.target) && !cartIcon.contains(e.target) && cartDrawer.classList.contains('open')) {
      cartDrawer.classList.remove('open');
    }
  });
  
  // Initialize
  loadPrefs();
  renderFullSite();
  renderTrending();
  updateCartUI();
</script>
</body>
</html>
